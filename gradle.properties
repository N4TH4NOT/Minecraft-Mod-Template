# Important Notes:
# Resource placeholders must also be declared in the expandProps map in
# buildSrc/src/main/groovy/multiloader-common.gradle.

# Project
project_name=Minecraft-Mod-Template
version=1.0.0
group=me.n4th4not.modid

# Modules: absent optional directories remain excluded; existing empty ones are initialized.
modules=common,fabric,forge,neoforge,minestom
required_modules=common
standalone_modules=minestom

# Java: compiler toolchains may differ from the JDK running Gradle.
java_version=21
common_java_version=21
fabric_java_version=21
forge_java_version=21
neoforge_java_version=21
buildsrc_java_version=21
gradle_java_version=21
minestom_gradle_java_version=25

# Common
minecraft_version=1.21.10
mod_name=Mod Name
mod_author=N4TH4NOT
mod_id=modid
license=CC0-1.0
credits=
description=The description of your mod. \nAccepts multilines.
minecraft_version_range=[1.21.10,1.21.11)
## New version are available on minecraft release note under 'Technical Changes'
## https://www.minecraft.net/en-us/article/minecraft-java-edition-1-21-9
minecraft_data_version=88
minecraft_pack_version=69

## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=20251010.172816
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.10
parchment_version=2025.10.12

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.138.4+1.21.10
fabric_loader_version=0.20.1

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/ for new versions
forge_version=60.1.18
forge_loader_version_range=[60,)

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.10.64
neoforge_loader_version_range=[4,)

# Minestom is a standalone server target with its own Java 25 / Gradle 9 build.
minestom_version=2025.12.19-1.21.10
minestom_java_version=25
minestom_main_class=me.n4th4not.modid.minestom.MinestomServer
# Used by Gradle run; distributions accept -Dtemplate.development through JAVA_OPTS.
minestom_development=false

# Dependencies
cloth_config_version=20.0.149
modmenu_version=16.0.1
mixin_version=0.8.7
mixinextras_version=0.5.5
jopt_simple_version=5.0.4

# Build plugins
fabric_loom_version=1.13.6
moddevgradle_version=2.0.148
forgegradle_version=6.0.54
mixingradle_version=0.7.38
foojay_resolver_version=1.0.0

# Test and logging libraries
junit_version=6.1.3
gson_version=2.15.0
tomlj_version=2.2.0
slf4j_version=2.0.17
test_max_heap_size=1G

# Development paths (relative to each module)
java_encoding=UTF-8
run_client_directory=runs/client
run_server_directory=runs/server
run_data_directory=runs/data
generated_resources_directory=src/generated/resources

# Gradle
gradle_version=8.14.6
gradle_distribution_sha256=7988ed071b2a07900e2ec715fca15c6ab72bce6db433af301fa7fa7e9407bd24
minestom_gradle_version=9.1.0
minestom_gradle_distribution_sha256=a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Optional: refresh compatible mod versions before each build/test invocation.
# Leave commented to allow -PautoUpdateModVersions=true or
# ORG_GRADLE_PROJECT_autoUpdateModVersions=true to enable it per environment.
# autoUpdateModVersions=true
