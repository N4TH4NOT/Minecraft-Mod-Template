name: Validate template or build project

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      repository_type:
        description: Repository mode (auto uses GitHub's template flag)
        type: choice
        options: [auto, template, project]
        default: auto
      update_mod_versions:
        description: Update compatible mod dependencies before a project build
        type: boolean
        default: false

env:
  ORG_GRADLE_PROJECT_autoUpdateModVersions: ${{ inputs.update_mod_versions && 'true' || 'false' }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select template checks or project builds
    runs-on: ubuntu-latest
    outputs:
      repository_type: ${{ steps.plan.outputs.repository_type }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      support_tests: ${{ steps.plan.outputs.support_tests }}
      gradle_java_version: ${{ steps.plan.outputs.gradle_java_version }}
      support_java_versions: ${{ steps.plan.outputs.support_java_versions }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test CI tooling, including a template without Java sources
        run: |
          python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('scripts/ci/tests')
          if suite.countTestCases() == 0:
              raise SystemExit('CI tooling has no tests.')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Read GitHub repository type and discover configured targets
        id: plan
        env:
          REPOSITORY_TYPE: ${{ inputs.repository_type || 'auto' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          repository_is_template="$(python3 -c 'import json,sys; value=json.load(open(sys.argv[1])).get("repository",{}).get("is_template"); print(str(value).lower() if isinstance(value,bool) else "")' "$GITHUB_EVENT_PATH")"
          if [ "$REPOSITORY_TYPE" = auto ] && [ -z "$repository_is_template" ]; then
            repository_is_template="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.is_template')"
          fi
          plan_args=(--repository-type "$REPOSITORY_TYPE" --github-output "$GITHUB_OUTPUT")
          if [ -n "$repository_is_template" ]; then
            plan_args+=(--repository-is-template "$repository_is_template")
          fi
          python3 scripts/ci/plan.py "${plan_args[@]}"
      - name: Report compilation scope and excluded modules before builds
        env:
          CI_REPOSITORY_MODE: ${{ steps.plan.outputs.repository_type }}
          CI_INCLUDED_MODULES: ${{ steps.plan.outputs.included_modules }}
          CI_EXCLUDED_MODULES: ${{ steps.plan.outputs.excluded_modules }}
          CI_BUILD_MATRIX: ${{ steps.plan.outputs.matrix }}
          CI_INITIALIZATION_MODULES: ${{ steps.plan.outputs.initialization_modules }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          included = json.loads(os.environ['CI_INCLUDED_MODULES'])
          excluded = json.loads(os.environ['CI_EXCLUDED_MODULES'])
          matrix = json.loads(os.environ['CI_BUILD_MATRIX'])['include']
          initializing = json.loads(os.environ['CI_INITIALIZATION_MODULES'])
          compiled = {row['target'] for row in matrix}
          if any(row['common'] for row in matrix):
              compiled.add('common')
          describe = lambda names: ', '.join(sorted(names)) or 'aucun'
          lines = [
              'Mode du dépôt : ' + os.environ['CI_REPOSITORY_MODE'],
              'Modules avec compilation planifiée : ' + describe(compiled),
              'Modules exclus (dossiers absents) : ' + describe(excluded),
              'Modules présents sans compilation planifiée : ' + describe(set(included) - compiled),
              'Dossiers vides à initialiser depuis les presets : ' + describe(initializing),
          ]
          print('\n'.join(lines))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write('\n'.join('- ' + line for line in lines) + '\n')
          PY

  scaffold:
    name: Test real Gradle scaffold generation without application compilation
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out scaffold and integration tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the configured bootstrap runtime
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ needs.plan.outputs.gradle_java_version }}
      - name: Set up Gradle and validate wrappers
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test initialization, preservation and idempotence
        shell: bash
        run: |
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/scaffold-tests.log"
          import unittest
          suite = unittest.defaultTestLoader.discover('scripts/ci/integration')
          if suite.countTestCases() == 0:
              raise SystemExit('Gradle scaffold integration has no tests.')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Upload scaffold integration log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scaffold-integration
          path: ${{ runner.temp }}/scaffold-tests.log
          if-no-files-found: warn

  template:
    name: Validate reusable scaffold without application code
    needs: plan
    if: needs.plan.outputs.repository_type == 'template'
    runs-on: ubuntu-latest
    steps:
      - name: Check out scaffold
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate official Gradle wrapper binaries
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check structure, configuration, resources and services
        run: python3 scripts/ci/validate_template.py --report "$RUNNER_TEMP/template-validation.json"
      - name: Upload template validation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: template-validation
          path: ${{ runner.temp }}/template-validation.json
          if-no-files-found: warn

  build_tools:
    name: Test Gradle build tooling in a derived project
    needs: plan
    if: needs.plan.outputs.support_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the configured Gradle runtime
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ needs.plan.outputs.support_java_versions }}
      - name: Use explicitly installed build tooling JDKs
        env:
          CI_JAVA_VERSIONS: ${{ needs.plan.outputs.support_java_versions }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          homes = []
          for version in os.environ['CI_JAVA_VERSIONS'].split():
              name = 'JAVA_HOME_' + version + '_X64'
              home = os.environ.get(name)
              if not home or not Path(home).is_dir():
                  raise SystemExit('Configured Java installation is missing: ' + name)
              homes.append(home)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as environment:
              environment.write('TEMPLATE_JAVA_INSTALLATIONS=' + ','.join(homes) + '\n')
          PY
      - name: Set up Gradle and validate wrappers
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Run build tooling tests
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths="$TEMPLATE_JAVA_INSTALLATIONS" -p buildSrc test
      - name: Require executed build tooling tests
        run: python3 scripts/ci/verify_results.py --modules buildSrc --report "$RUNNER_TEMP/build-tools-tests.json"
      - name: Upload build tooling reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports-build-tools
          path: |
            buildSrc/build/reports/
            buildSrc/build/test-results/
            ${{ runner.temp }}/build-tools-tests.json
          if-no-files-found: warn

  build:
    name: Build and test ${{ matrix.target }} in a derived project
    needs: plan
    if: needs.plan.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up configured toolchains and Gradle runtime Java ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java_versions }}
      - name: Use only explicitly installed Java toolchains
        env:
          CI_JAVA_VERSIONS: ${{ matrix.java_versions }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          homes = []
          for version in os.environ['CI_JAVA_VERSIONS'].split():
              name = 'JAVA_HOME_' + version + '_X64'
              home = os.environ.get(name)
              if not home or not Path(home).is_dir():
                  raise SystemExit('Configured Java installation is missing: ' + name)
              homes.append(home)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as environment:
              environment.write('TEMPLATE_JAVA_INSTALLATIONS=' + ','.join(homes) + '\n')
          PY
      - name: Set up Gradle and validate wrappers
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Initialize configured empty target directories without compiling
        if: matrix.initialize
        env:
          BOOTSTRAP_JAVA: ${{ matrix.bootstrap_java }}
        run: |
          bootstrap_home_variable="JAVA_HOME_${BOOTSTRAP_JAVA}_X64"
          JAVA_HOME="${!bootstrap_home_variable}" ./gradlew --no-daemon --max-workers=2 --no-configuration-cache --stacktrace -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths="$TEMPLATE_JAVA_INSTALLATIONS" -p gradle/bootstrap help
      - name: Build and test configured modloader
        if: matrix.kind == 'mod'
        env:
          TARGET: ${{ matrix.target }}
          HAS_COMMON: ${{ matrix.common }}
        run: |
          gradle_tasks=(":$TARGET:build")
          if [ "$HAS_COMMON" = true ]; then
            gradle_tasks=(:common:check "${gradle_tasks[@]}")
          fi
          ./gradlew --no-daemon --max-workers=2 --no-configuration-cache --stacktrace -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths="$TEMPLATE_JAVA_INSTALLATIONS" -PautoUpdateModVersions="$ORG_GRADLE_PROJECT_autoUpdateModVersions" "${gradle_tasks[@]}"
      - name: Build and test standalone Minestom with its own wrapper
        if: matrix.kind == 'minestom'
        run: ./minestom/gradlew --no-daemon --max-workers=2 --no-configuration-cache --stacktrace -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths="$TEMPLATE_JAVA_INSTALLATIONS" -p minestom build
      - name: Require executed tests for every application module
        env:
          TARGET: ${{ matrix.target }}
          HAS_COMMON: ${{ matrix.common }}
        run: |
          modules=("$TARGET")
          if [ "$HAS_COMMON" = true ]; then
            modules+=(common)
          fi
          python3 scripts/ci/verify_results.py --modules "${modules[@]}" --report "$RUNNER_TEMP/application-tests.json"
      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports-${{ matrix.target }}
          path: |
            gradle.properties
            common/build/reports/
            common/build/test-results/
            ${{ matrix.target }}/build/reports/
            ${{ matrix.target }}/build/test-results/
            ${{ runner.temp }}/application-tests.json
          if-no-files-found: warn
      - name: Upload mod artifacts
        if: matrix.kind == 'mod'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mod-${{ matrix.target }}
          path: ${{ matrix.target }}/build/libs/*.jar
          if-no-files-found: error
      - name: Upload standalone server distributions
        if: matrix.kind == 'minestom'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-minestom
          path: minestom/build/distributions/*
          if-no-files-found: error
