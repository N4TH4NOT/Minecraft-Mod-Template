plugins {
    id 'application'
}

apply from: file('../gradle/template-properties.gradle')
apply from: file('../gradle/wrapper-configuration.gradle')
apply from: file('../gradle/build-plan.gradle')

// The standalone build shares parameters while retaining its own toolchain.
group = templateProperty('group')
version = templateProperty('version')
def minecraftVersion = templateProperty('minecraft_version')
def minestomVersion = templateProperty('minestom_version')
def artifactName = "${templateProperty('mod_id')}-minestom-${minecraftVersion}"

if (!minestomVersion.endsWith("-${minecraftVersion}")) {
    throw new GradleException('minestom_version must target the configured minecraft_version')
}

base {
    archivesName = artifactName
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(templateProperty('minestom_java_version').toInteger())
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "net.minestom:minestom:${minestomVersion}"
    runtimeOnly "org.slf4j:slf4j-simple:${slf4j_version}"
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = templateProperty('minestom_main_class')
    applicationName = artifactName
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = templateProperty('java_encoding')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'template.minecraft.version', minecraftVersion
    systemProperty 'template.minecraft.version.range', templateProperty('minecraft_version_range')
    systemProperty 'template.minecraft.pack.version', templateProperty('minecraft_pack_version')
    systemProperty 'template.java.version', templateProperty('minestom_java_version')
    maxHeapSize = templateProperty('test_max_heap_size')
}
