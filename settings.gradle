pluginManagement {
    plugins {
        id 'fabric-loom' version providers.gradleProperty('fabric_loom_version').get()
        id 'net.neoforged.moddev' version providers.gradleProperty('moddevgradle_version').get()
        id 'net.minecraftforge.gradle' version providers.gradleProperty('forgegradle_version').get()
        id 'org.spongepowered.mixin' version providers.gradleProperty('mixingradle_version').get()
    }
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('net.fabricmc.unpick')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version providers.gradleProperty('foojay_resolver_version').get()
}

rootProject.name = providers.gradleProperty('project_name').get()
def csvProperty = { String key ->
    providers.gradleProperty(key).orElse('').get().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
}
def declaredModules = csvProperty('modules')
def requiredModules = csvProperty('required_modules')
def standaloneModules = csvProperty('standalone_modules')
def seenModules = new LinkedHashSet<String>()
declaredModules.each { name ->
    if (!(name ==~ /[A-Za-z0-9_-]+(?:\/[A-Za-z0-9_-]+)*/) || !seenModules.add(name)) {
        throw new GradleException("Invalid or duplicate module in gradle.properties: ${name}")
    }
}
if (!declaredModules.containsAll(requiredModules) || !declaredModules.containsAll(standaloneModules)
        || !requiredModules.contains('common') || standaloneModules.contains('common')
        || (declaredModules.contains('minestom') && !standaloneModules.contains('minestom'))) {
    throw new GradleException('Invalid module configuration: common must be required and Minestom must be standalone.')
}
requiredModules.each { name ->
    if (!file(name).isDirectory()) {
        throw new GradleException("Required module directory is missing: ${name}/")
    }
}

// Initialize only already-present empty module directories; never recreate deleted targets.
apply from: file('gradle/scaffold.gradle')

def includedModules = []
def excludedModules = []
declaredModules.findAll { !(it in standaloneModules) }.each { name ->
    def directory = file(name)
    if (!directory.exists() && !java.nio.file.Files.isSymbolicLink(directory.toPath())) {
        excludedModules.add(name)
    } else {
        def centralBuild = file("gradle/modules/${name}.gradle")
        def buildScript = centralBuild.isFile() ? centralBuild : new File(directory, 'build.gradle')
        if (!directory.isDirectory() || !buildScript.isFile()) {
            throw new GradleException("Module ${name} has no central or local build configuration")
        }
        def projectPath = name.replace('/', ':')
        include(projectPath)
        project(":${projectPath}").projectDir = directory
        project(":${projectPath}").buildFileName = directory.toPath().relativize(buildScript.toPath()).toString()
        includedModules.add(name)
    }
}

logger.lifecycle('Modules disponibles dans le build racine : {}', includedModules.join(', '))
logger.lifecycle('Modules exclus (dossiers absents) : {}', excludedModules ? excludedModules.join(', ') : 'aucun')
logger.lifecycle('Tâches demandées : {}', gradle.startParameter.taskNames.join(', ') ?: '(tâches par défaut)')
logger.lifecycle('Minestom : {}', file('minestom').exists()
        ? 'build autonome, à lancer avec minestom/gradlew -p minestom'
        : 'exclu (dossier absent)')
